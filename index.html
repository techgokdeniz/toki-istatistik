  .toggle-btn {
    padding: 6px 16px; border-radius: 6px; border: 1px solid #334155;
    background: transparent; color: #94a3b8; cursor: pointer; font-size: 13px;

  }
  .toggle-btn.active { background: #334155; color: #f8fafc; }

  }
  .bar-track {
    flex: 1; height: 28px; background: #1e293b; border-radius: 6px;
    position: relative; overflow: hidden;
  }

  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #253045; }
  .pct { color: #38bdf8; font-weight: 600; }
  .pct-high { color: #4ade80; font-weight: 600; }
  .pct-low { color: #f87171; font-weight: 600; }

const totalKonut = DATA.reduce((s, il) => s + il.toplamKonut, 0);
const totalBasvuru = DATA.reduce((s, il) => s + il.toplamBasvuru, 0);
const totalIlce = DATA.reduce((s, il) => s + il.ilceler.length, 0);

function formatNum(n) {
  return n.toLocaleString("tr-TR");
}

function pctClass(v) {
  if (v >= 50) return "pct-high";
  if (v <= 10) return "pct-low";
  return "pct";
}

function barColor(v) {
  if (v >= 50) return "#4ade80";
  if (v >= 25) return "#38bdf8";
  if (v >= 10) return "#f59e0b";
  return "#f87171";
}

// Stats
document.getElementById("statsRow").innerHTML = [
  { v: "81", l: "İl", raw: true },
  { v: activeIl, l: "Aktif İl (verisi olan)" },
  { v: totalIlce, l: "İlçe" },
  { v: totalProje, l: "Proje" },
  { v: totalKonut, l: "Toplam Konut" },
  { v: totalBasvuru, l: "Toplam Başvuru" },
].map(s => `<div class="stat-card"><div class="value">${s.raw ? s.v : formatNum(s.v)}</div><div class="label">${s.l}</div></div>`).join("");

// Warning section
if (EKSIK_ILLER.length > 0) {
  document.getElementById("warningSection").innerHTML = `
    <div class="warning-section">
      <p><span>${EKSIK_ILLER.join(", ")}</span> için kura sonuçları henüz açıklanmadı.</p>
      <p class="disclaimer">Bu sayfa yalnızca bir case study niteliğindedir. talep.toki.gov.tr adresindeki kamuya açık veriler kullanılarak oluşturulmuştur.</p>
    </div>
  `;
}

// Tab buttons
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentCat = btn.dataset.cat;
    render();
  });
});

// Toggle buttons
document.querySelectorAll(".toggle-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".toggle-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentView = btn.dataset.view;
    document.getElementById("detailView").classList.remove("active");
    render();
  });
});

// Search
document.getElementById("searchBox").addEventListener("input", (e) => {
  searchTerm = e.target.value.toLowerCase();
  render();
});

function getIlRows() {
  return DATA
    .filter(il => il.kategoriler?.[currentCat])
    .map(il => ({
      id: il.il,
      name: il.ilAdi,
      konut: il.toplamKonut,
      basvuru: il.toplamBasvuru,
      kat: il.kategoriler[currentCat],
      ilceSayisi: il.ilceSayisi,
    }))
    .filter(r => r.kat.basvuru > 0)
    .filter(r => !searchTerm || r.name.toLowerCase().includes(searchTerm))
    .sort((a, b) => b.kat.kazanmaSansi - a.kat.kazanmaSansi);
}

function getIlceRows() {
  const rows = [];
  for (const il of DATA) {
    for (const ilce of il.ilceler) {
      const k = ilce.kategoriler?.[currentCat];
      if (!k || k.basvuru === 0) continue;
      const name = il.ilAdi + " / " + ilce.ilce;
      if (searchTerm && !name.toLowerCase().includes(searchTerm)) continue;
      rows.push({
        name,
        ilAdi: il.ilAdi,
        ilce: ilce.ilce,
        konut: ilce.toplamKonut,
        basvuru: ilce.toplamBasvuru,
        kat: k,
      });
    }
  }
  return rows.sort((a, b) => b.kat.kazanmaSansi - a.kat.kazanmaSansi);
}

function renderBars(rows, limit) {
  const items = rows.slice(0, limit);
  const maxPct = Math.max(...items.map(r => r.kat.kazanmaSansi), 1);
  return items.map(r => {
    const w = (r.kat.kazanmaSansi / Math.max(maxPct, 1)) * 100;
    const color = barColor(r.kat.kazanmaSansi);
    return `<div class="bar-row">
      <div class="bar-label">${r.name}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${w}%;background:${color}">%${r.kat.kazanmaSansi}</div>
      </div>
      <div class="bar-info">${formatNum(r.kat.kontenjan)} kontenjan / ${formatNum(r.kat.basvuru)} başvuru</div>
    </div>`;
  }).join("");
}

function renderTable(rows, showIlce) {
  const headerExtra = showIlce ? "" : '<th>İlçe</th>';
  let html = `<table>
    <thead><tr>
      <th>#</th><th>${showIlce ? "İl / İlçe" : "İl"}</th>${headerExtra}
      <th class="num">Kontenjan</th><th class="num">Başvuru</th>
      <th class="num">Kazanma %</th><th class="num">Top. Konut</th><th class="num">Top. Başvuru</th>
    </tr></thead><tbody>`;

  rows.forEach((r, i) => {
    const cls = !showIlce ? ' class="clickable" data-il="' + r.id + '"' : "";
    const extra = showIlce ? "" : `<td>${r.ilceSayisi || "-"}</td>`;
    html += `<tr${cls}>
      <td>${i + 1}</td><td>${r.name}</td>${extra}
      <td class="num">${formatNum(r.kat.kontenjan)}</td>
      <td class="num">${formatNum(r.kat.basvuru)}</td>
      <td class="num ${pctClass(r.kat.kazanmaSansi)}">%${r.kat.kazanmaSansi}</td>
      <td class="num">${formatNum(r.konut)}</td>
      <td class="num">${formatNum(r.basvuru)}</td>
    </tr>`;
  });

  html += "</tbody></table>";
  return html;
}

function render() {
  const mainView = document.getElementById("mainView");
  const isIl = currentView === "il";
  const rows = isIl ? getIlRows() : getIlceRows();
  const catLabel = rows[0]?.kat?.label || currentCat;

  let out = "";
  out += `<div class="section-title">${catLabel} - Top 10 ${isIl ? "İl" : "İlçe"} (Kazanma Şansına Göre)</div>`;
  out += `<div class="bar-chart-section">${renderBars(rows, 10)}</div>`;
  out += `<div class="section-title">Tüm ${isIl ? "İller" : "İlçeler"} (${rows.length} adet)</div>`;
  out += renderTable(rows, !isIl);

  mainView.innerHTML = out;
  document.getElementById("detailView").classList.remove("active");

  // Click handlers for il rows
  if (isIl) {
    document.querySelectorAll("tr.clickable").forEach(tr => {
      tr.addEventListener("click", () => showIlDetail(tr.dataset.il));
    });
  }
}

function showIlDetail(ilSlug) {
  const il = DATA.find(d => d.il === ilSlug);
  if (!il) return;

  const detailView = document.getElementById("detailView");
  const catLabel = il.kategoriler?.[currentCat]?.label || currentCat;

  const ilceRows = il.ilceler
    .filter(ilce => ilce.kategoriler?.[currentCat]?.basvuru > 0)
    .map(ilce => ({
      name: ilce.ilce,
      konut: ilce.toplamKonut,
      basvuru: ilce.toplamBasvuru,
      kat: ilce.kategoriler[currentCat],
    }))
    .sort((a, b) => b.kat.kazanmaSansi - a.kat.kazanmaSansi);

  // All categories for this il
  const katKeys = ["engelli", "emekli", "genc", "ucCocukVeUzeri", "diger", "sehitGazi"];
  let summaryHtml = '<table><thead><tr><th>Kategori</th><th class="num">Kontenjan</th><th class="num">Başvuru</th><th class="num">Kazanma %</th></tr></thead><tbody>';
  for (const key of katKeys) {
    const k = il.kategoriler?.[key];
    if (!k) continue;
    const active = key === currentCat ? ' style="background:#1e3a5f"' : "";
    summaryHtml += `<tr${active}><td>${k.label}</td><td class="num">${formatNum(k.kontenjan)}</td><td class="num">${formatNum(k.basvuru)}</td><td class="num ${pctClass(k.kazanmaSansi)}">%${k.kazanmaSansi}</td></tr>`;
  }
  summaryHtml += "</tbody></table>";

  let out = `<button class="back-btn" onclick="document.getElementById('detailView').classList.remove('active')">← Geri</button>`;
  out += `<div class="section-title">${il.ilAdi} — Genel Bakış (Toplam ${formatNum(il.toplamKonut)} konut, ${formatNum(il.toplamBasvuru)} başvuru)</div>`;
  out += `<div class="grid-2"><div>${summaryHtml}</div><div>`;

  // Bar chart for ilceler
  const maxPct = Math.max(...ilceRows.map(r => r.kat.kazanmaSansi), 1);
  out += `<div class="section-title" style="margin-top:0">${catLabel} — İlçeler</div><div class="bar-chart-section">`;
  for (const r of ilceRows) {
    const w = (r.kat.kazanmaSansi / Math.max(maxPct, 1)) * 100;
    const color = barColor(r.kat.kazanmaSansi);
    out += `<div class="bar-row">
      <div class="bar-label" style="width:140px">${r.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}">%${r.kat.kazanmaSansi}</div></div>
      <div class="bar-info" style="width:160px">${formatNum(r.kat.kontenjan)}k / ${formatNum(r.kat.basvuru)}b</div>
    </div>`;
  }
  out += "</div></div></div>";

  // Full ilce table
  out += `<div class="section-title">${il.ilAdi} — ${catLabel} İlçe Detayı</div>`;
  let tbl = '<table><thead><tr><th>#</th><th>İlçe</th><th class="num">Kontenjan</th><th class="num">Başvuru</th><th class="num">Kazanma %</th><th class="num">Top. Konut</th><th class="num">Top. Başvuru</th></tr></thead><tbody>';
  ilceRows.forEach((r, i) => {
    tbl += `<tr><td>${i+1}</td><td>${r.name}</td><td class="num">${formatNum(r.kat.kontenjan)}</td><td class="num">${formatNum(r.kat.basvuru)}</td><td class="num ${pctClass(r.kat.kazanmaSansi)}">%${r.kat.kazanmaSansi}</td><td class="num">${formatNum(r.konut)}</td><td class="num">${formatNum(r.basvuru)}</td></tr>`;
  });
  tbl += "</tbody></table>";
  out += tbl;

  detailView.innerHTML = out;
  detailView.classList.add("active");
  detailView.scrollIntoView({ behavior: "smooth" });
}

render();
</script>
</body>
</html>
